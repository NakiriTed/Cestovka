    <style>
        /* Speciální styly pro čitelnější Fórum */
        body {
            /* Fórum si zaslouží klidnější pozadí pro čtení, mírně odlišné od domovské stránky */
            background: var(--bg-color); 
        }

        .forum-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8rem 2rem 4rem 2rem; /* Odsazení pro menu nahoře */
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .forum-wrap {
                grid-template-columns: 1fr;
            }
        }

        .forum-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .forum-header h1 {
            font-size: 2rem;
        }

        /* Sidebar s kategoriemi */
        .forum-sidebar .glass {
            padding: 1.5rem;
            position: sticky;
            top: 100px;
        }

        .forum-sidebar h3 {
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        .category-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .category-list li button {
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: var(--text-main);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-list li button:hover,
        .category-list li button.active {
            background: rgba(255, 102, 178, 0.1);
            color: var(--accent-color);
        }

        /* Seznam témat */
        .threads-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .thread-card {
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: var(--text-main);
        }

        .thread-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-color: var(--accent-color);
        }

        .thread-avatar {
            font-size: 2.5rem;
            color: var(--text-muted);
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .thread-content {
            flex: 1;
        }

        .thread-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .thread-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .thread-tag {
            background: rgba(255,255,255,0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .thread-stats {
            display: flex;
            gap: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Moderátorský tag */
        .mod-tag {
            background: rgba(255, 51, 51, 0.2);
            color: #ff3333;
            border: 1px solid #ff3333;
        }

        /* Uživatelské menu (přihlášený) */
        .user-auth-area {
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 12px;
            margin-top: 2rem;
            text-align: center;
            border: 1px solid var(--glass-border);
        }

        [data-theme="light"] .user-auth-area {
            background: rgba(255,255,255,0.7);
        }

    </style>
</head>

    <script type="module">
        import { db, auth, isConfigured, collection, addDoc, getDocs, getDoc, query, orderBy, serverTimestamp, doc, setDoc } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Globální proměnné Fóra
        window.forumUser = null;

        // UI Modály - Helpery
        window.openNewThreadModal = () => {
            if(!window.forumUser) {
                window.openAuthModal();
                return;
            }
            document.getElementById('newThreadModal').classList.add('active');
        };
        window.closeNewThreadModal = () => document.getElementById('newThreadModal').classList.remove('active');

        // --- AUTHENTIKACE LOKÁLNÍ STAV ---
        if (isConfigured) {
            onAuthStateChanged(auth, (user) => {
                window.forumUser = user || null;
            });
        }

        window.currentForumCategory = 'Vše';

        // --- NAČÍTÁNÍ TÉMAT (Firestore) ---
        async function loadThreads() {
            const container = document.getElementById('threads-container');
            container.innerHTML = `
                <div class="glass" style="padding: 2rem; text-align: center; color: var(--text-muted);">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                    <p>Načítám příspěvky z fóra...</p>
                </div>
            `;

            if(!isConfigured) {
                container.innerHTML = '<p style="text-align:center;">Fórum vyžaduje připojení k Firebase.</p>';
                return;
            }

            try {
                // Fetch profiles map
                const uSnap = await getDocs(collection(db, "users"));
                const userProfiles = {};
                uSnap.forEach(u => userProfiles[u.id] = u.data());

                const q = query(collection(db, "forum_threads"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                let threads = [];
                snap.forEach(d => threads.push({ id: d.id, ...d.data() }));

                if (window.currentForumCategory !== 'Vše') {
                    threads = threads.filter(t => t.category === window.currentForumCategory);
                }

                if (threads.length === 0) {
                    container.innerHTML = '<p style="text-align:center;">Zatím žádná témata v této kategorii.</p>';
                    return;
                }

                container.innerHTML = threads.map(t => {
                    const dateStr = t.createdAt ? new Date(t.createdAt).toLocaleString('cs-CZ') : 'Neznámý čas';
                    const authorProfile = userProfiles[t.authorUid];
                    const avatarHtml = authorProfile?.avatarUrl 
                        ? `<img src="${authorProfile.avatarUrl}" style="width:100%; height:100%; object-fit:cover;">`
                        : `<i class="fa-solid fa-user"></i>`;
                    
                    return `
                    <a href="thread.html#${t.id}" class="glass thread-card">
                        <div class="thread-avatar" style="overflow:hidden;">${avatarHtml}</div>
                        <div class="thread-content">
                            <div class="thread-title">${t.title}</div>
                            <div class="thread-meta">
                                <span class="thread-tag">${t.category}</span>
                                <span>Od: <strong>${t.authorName}</strong></span>
                                <span><i class="fa-regular fa-clock"></i> ${dateStr}</span>
                            </div>
                        </div>
                        <div class="thread-stats">
                            <div style="text-align: center;">
                                <i class="fa-regular fa-comment-dots" style="font-size: 1.2rem; display: block; margin-bottom: 5px;"></i>
                                <strong>${t.repliesCount || 0}</strong>
                            </div>
                        </div>
                    </a>
                `}).join("");
            } catch(e) {
                console.error("Chyba při načítání témat:", e);
                container.innerHTML = '<p style="text-align:center; color:red;">Chyba načítání.</p>';
            }
        }

        window.filterForum = (category) => {
            window.currentForumCategory = category;
            document.querySelectorAll('.category-list button').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(category) || (category==='Vše' && btn.innerText.includes('Všechna')));
            });
            loadThreads();
        };

        // Přidání nového tématu
        document.getElementById('new-thread-form').onsubmit = async (e) => {
            e.preventDefault();
            if(!window.forumUser) { alert("Musíte být přihlášeni."); return; }

            const title = document.getElementById('thread-title').value;
            const category = document.getElementById('thread-category').value;
            const content = document.getElementById('thread-content').value;

            try {
                await addDoc(collection(db, "forum_threads"), {
                    title,
                    category,
                    content,
                    authorName: window.forumUser.displayName || window.forumUser.email.split('@')[0],
                    authorUid: window.forumUser.uid,
                    createdAt: new Date().toISOString(),
                    repliesCount: 0
                });
                closeNewThreadModal();
                document.getElementById('new-thread-form').reset();
                loadThreads();
            } catch(err) {
                console.error("Chyba:", err);
                alert("Nepodařilo se vytvořit téma: " + err.message);
            }
        };

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadThreads();
        });

    </script>
