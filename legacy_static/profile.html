<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="profile.title">Uživatelský Profil | Tedův východní svět</title>
    <link rel="stylesheet" href="styles.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Okamžitá aplikace tématu pro zamezení blikání
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        body {
            background: var(--bg-color);
        }

        .profile-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 8rem 2rem 4rem 2rem;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            position: relative;
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: var(--text-muted);
            border: 4px solid var(--accent-color);
            overflow: hidden;
            position: relative;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info h1 {
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }

        .profile-info p {
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .profile-tag {
            background: rgba(255, 51, 51, 0.2);
            color: #ff3333;
            border: 1px solid #ff3333;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-right: 10px;
        }

        .profile-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        @media(max-width: 768px) {
            .profile-details {
                grid-template-columns: 1fr;
            }
        }

        .detail-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 12px;
        }

        .detail-box h3 {
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            font-weight: bold;
            text-align: right;
        }

        .edit-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        .edit-btn:hover {
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
                align-items: center;
            }
            .edit-btn {
                position: relative;
                top: 0;
                right: 0;
                margin-top: 1rem;
                width: 100%;
            }
        }

        /* FormStyles for hidden edit block */
        .edit-form-block {
            display: none;
            margin-top: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-family: inherit;
            font-size: 1rem;
        }

        [data-theme="light"] .form-input {
            background: #f9f9f9;
            color: #333;
            border-color: #ddd;
        }

        .avatar-upload-wrapper {
            position: relative;
            cursor: pointer;
        }

        .avatar-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .avatar-upload-wrapper:hover .avatar-overlay {
            opacity: 1;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-torii-gate"></i> <span
                    style="color: #ff66b2;">Tedův</span> <span style="color: var(--text-main);">východní</span> <span
                    style="color: #ff3333;">svět</span></a>
            <ul class="nav-links">
                <li><a href="planner.html" data-i18n="nav.planner">Plánovač</a></li>
                <li><a href="map.html" data-i18n="nav.map">Mapa</a></li>
                <li><a href="gallery.html" data-i18n="nav.gallery">Galerie</a></li>

                <li class="nav-dropdown">
                    <a href="#" style="cursor: default;"  data-i18n="nav.destinations">Destinace <i class="fa-solid fa-chevron-down" style="font-size: 0.8rem;"></i></a>
                    <div class="nav-dropdown-content">
                        <a href="japanese.html"  data-i18n="nav.japanese">Japonsko</a>
                        <a href="korea.html"  data-i18n="nav.korea">Jižní Korea</a>
                    </div>
                </li>
                <li class="nav-dropdown">
                    <a href="#" style="cursor: default;"  data-i18n="nav.languages">Jazyky <i class="fa-solid fa-chevron-down" style="font-size: 0.8rem;"></i></a>
                    <div class="nav-dropdown-content">
                        <a href="japonsky.html" >🇯🇵 Japonština</a>
                        <a href="korejsky.html" >🇰🇷 Korejština</a>
                    </div>
                </li>
                <li><a href="about.html" style="white-space: nowrap;" data-i18n="nav.about">O mně</a></li>
                <li><a href="forum.html" data-i18n="nav.forum">Fórum</a></li>
                <li><a href="contact.html" data-i18n="nav.contact">Kontakt</a></li>
            </ul>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div id="nav-auth-container" style="display: flex; align-items: center; gap: 5px; margin-right: 5px;">
                    <!-- Statické místo pro auth tlačítko pro zamezení skákání menu -->
                    <button onclick="globalOpenLoginModal()" title="Přihlásit se" class="nav-login-btn" style="background: var(--accent-color); border: none; cursor: pointer; color: white; border-radius: 20px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; font-family: inherit; display: flex; align-items: center; gap: 6px; white-space: nowrap; transition: opacity 0.2s;" data-i18n="nav.login"><i class="fa-solid fa-right-to-bracket"></i> Přihlásit se</button>
                </div>
                <a href="admin.html" class="theme-toggle"
                    style="text-decoration: none; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%;"
                    title="Admin Login"><i class="fa-solid fa-user-lock"></i></a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Přepnout motiv"><i
                        class="fa-solid fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <main class="profile-wrap">
        <a href="forum.html"
            style="color: var(--text-muted); text-decoration: none; display: inline-block; margin-bottom: 2rem;"><i
                class="fa-solid fa-arrow-left"></i> Zpět na fórum</a>

        <div id="profile-content-area">
            <div class="glass" style="padding: 2rem; text-align: center;"><i class="fa-solid fa-spinner fa-spin"
                    style="font-size: 2rem;"></i></div>
        </div>

        <!-- Edit Form -->
        <div class="glass edit-form-block" id="edit-form-block">
            <h2 style="margin-bottom: 1.5rem;"><i class="fa-solid fa-user-pen"></i> Úprava profilu</h2>
            <form id="profile-edit-form">
                <div class="form-group">
                    <label>Zobrazované jméno (Přezdívka na fóru)</label>
                    <input type="text" id="edit-display-name" class="form-input" required
                        pattern="^[a-zA-Zá-žÁ-Ž\s.]+$" title="Jméno může obsahovat pouze písmena"
                        oninput="this.value = this.value.replace(/[0-9]/g, '')">
                </div>
                <div class="profile-details" style="margin-top: 0;">
                    <div class="form-group">
                        <label>Skutečné jméno</label>
                        <input type="text" id="edit-real-name" class="form-input" placeholder="např. Jiří Král"
                            pattern="^[a-zA-Zá-žÁ-Ž\s.]+$" title="Jméno může obsahovat pouze písmena"
                            oninput="this.value = this.value.replace(/[0-9]/g, '')">
                    </div>
                    <div class="form-group">
                        <label>Pohlaví</label>
                        <select id="edit-gender" class="form-input">
                            <option value="">Nevybráno</option>
                            <option value="Muž">Muž</option>
                            <option value="Žena">Žena</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Město / Bydliště</label>
                        <input type="text" id="edit-city" class="form-input" placeholder="např. Praha">
                    </div>
                    <div class="form-group">
                        <label>Datum narození (Pro výpočet věku)</label>
                        <input type="date" id="edit-birth" class="form-input" min="1900-01-01" max="2024-01-01">
                    </div>
                </div>
                <div class="form-group">
                    <label>Jaké zájezdy s námi máte za sebou? (Zaškrtněte proběhlé cesty)</label>
                    <div id="trip-checkboxes"
                        style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border: 1px solid var(--glass-border); text-align: left;">
                        <!-- Dynamicky načteno z Firestore -->
                        <div class="skeleton skeleton-line full" style="height:30px;"></div>
                        <div class="skeleton skeleton-line long" style="height:30px;"></div>
                        <div class="skeleton skeleton-line medium" style="height:30px;"></div>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 2rem;">
                    <button type="button" class="btn btn-cancel" onclick="cancelEdit()"
                        style="background: transparent; border: 1px solid var(--glass-border); padding: 12px 25px; border-radius: 8px; color: white; cursor: pointer;">Zrušit
                        úpravy</button>
                    <button type="submit" class="btn btn-cms"
                        style="background: var(--accent-color); color: white; padding: 12px 30px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold;"
                        id="save-profile-btn">Uložit změny do profilu</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        import { db, auth, isConfigured, doc, getDoc, updateDoc, setDoc, onAuthStateChanged, storage, ref, uploadBytes, getDownloadURL } from './firebase-config.js';

        let targetUid = new URLSearchParams(window.location.search).get('uid');
        let currentUser = null;
        let userData = {};

        // Věk Calculator
        function calculateAge(birthdayString) {
            if (!birthdayString) return "Skryto";
            const birthDate = new Date(birthdayString);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return isNaN(age) ? "Neznámo" : age + " let";
        }

        async function loadProfile() {
            if (!isConfigured) return;
            try {
                // Pokud není definováno uid, redirect
                if (!targetUid) {
                    document.getElementById('profile-content-area').innerHTML = '<p style="text-align:center;">Profil nenalezen.</p>';
                    return;
                }

                const uSnap = await getDoc(doc(db, "users", targetUid));
                if (!uSnap.exists()) {
                    document.getElementById('profile-content-area').innerHTML = '<div class="glass" style="padding:2rem;"><p style="text-align:center;">Uživatel dosud nemá vyplněný profilový soubor v databázi.</p></div>';
                    return;
                }

                userData = uSnap.data();
                renderProfileView();

            } catch (e) {
                console.error("Chyba načítání profilu:", e);
                document.getElementById('profile-content-area').innerHTML = '<p style="color:red; text-align:center;">Chyba načtení databáze.</p>';
            }
        }

        function renderProfileView() {
            const age = calculateAge(userData.birthDate);
            const joined = userData.createdAt ? new Date(userData.createdAt).toLocaleDateString('cs-CZ') : "Neznámo";
            const avatarHtml = userData.avatarUrl
                ? `<img src="${userData.avatarUrl}" alt="Avatar">`
                : `<i class="fa-solid fa-user"></i>`;
            const tripsData = Array.isArray(userData.trips) ? userData.trips.join(', ') : (userData.trips || "");
            const tripsList = tripsData.split(',').filter(x => x.trim()).map(x => `<li><i class="fa-solid fa-plane-departure" style="color:var(--accent-color); margin-right:5px;"></i> ${x.trim()}</li>`).join("");

            let editButtonHtml = "";
            let uploadInputHtml = "";

            if (currentUser && currentUser.uid === targetUid) {
                editButtonHtml = `<button class="edit-btn" onclick="startEdit()"><i class="fa-solid fa-pen"></i> Upravit / Fotka</button>`;
                uploadInputHtml = `
                    <div class="avatar-overlay">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                    <input type="file" id="avatar-input" accept="image/*" onchange="uploadAvatar(event)">
                `;
            }

            document.getElementById('profile-content-area').innerHTML = `
                <div class="glass" style="padding: 2rem; position: relative;">
                    ${editButtonHtml}
                    <div class="profile-header">
                        <label class="profile-avatar avatar-upload-wrapper">
                            ${avatarHtml}
                            ${uploadInputHtml}
                        </label>
                        <div class="profile-info">
                            <h1>${userData.displayName || "Neznámý cestovatel"}</h1>
                            <p>${userData.email ? `<i class="fa-solid fa-envelope"></i> Skryto (Fórum)` : ''}</p>
                            <div style="margin-top: 1rem;">
                                <span class="profile-tag"><i class="fa-solid fa-passport"></i> Osobní profil</span>
                            </div>
                        </div>
                    </div>

                    <div class="profile-details">
                        <div class="detail-box">
                            <h3><i class="fa-solid fa-address-card"></i> Základní informace</h3>
                            <div class="info-row"><span class="info-label">Skutečné jméno</span><span class="info-value">${userData.realName || '-'}</span></div>
                            <div class="info-row"><span class="info-label">Věk</span><span class="info-value">${age}</span></div>
                            <div class="info-row"><span class="info-label">Pohlaví</span><span class="info-value">${userData.gender || '-'}</span></div>
                            <div class="info-row"><span class="info-label">Bydliště</span><span class="info-value">${userData.city || '-'}</span></div>
                            <div class="info-row"><span class="info-label">Členem od</span><span class="info-value">${joined}</span></div>
                        </div>

                        <div class="detail-box">
                            <h3><i class="fa-solid fa-suitcase-rolling"></i> Absolvované zájezdy</h3>
                            ${tripsList ? `<ul style="list-style:none; padding:0; margin:0;">${tripsList}</ul>` : '<p style="color:var(--text-muted); font-size:0.9rem;">Tento uživatel se s námi zatím nikde nechlubil, nebo nevyplnil historii svých cest.</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        window.startEdit = async () => {
            document.getElementById('profile-content-area').style.display = 'none';
            const eb = document.getElementById('edit-form-block');
            eb.style.display = 'block';

            // Fill values
            document.getElementById('edit-display-name').value = userData.displayName || '';
            document.getElementById('edit-real-name').value = userData.realName || '';
            document.getElementById('edit-gender').value = userData.gender || '';
            document.getElementById('edit-city').value = userData.city || '';
            document.getElementById('edit-birth').value = userData.birthDate || '';

            // Dynamicky načíst itineráře z Firestore
            const tripsBox2 = (userData.trips || "");
            const userTrips = Array.isArray(tripsBox2) ? tripsBox2 : tripsBox2.split(',').map(x => x.trim()).filter(Boolean);
            await populateTripCheckboxes(userTrips);
        };

        window.cancelEdit = () => {
            document.getElementById('edit-form-block').style.display = 'none';
            document.getElementById('profile-content-area').style.display = 'block';
        };

        window.uploadAvatar = async (e) => {
            const file = e.target.files[0];
            if (!file || !currentUser) return;

            // Upload
            const storageRef = ref(storage, 'avatars/' + currentUser.uid + '_' + file.name);
            try {
                // UI feedback
                const overlay = document.querySelector('.avatar-overlay');
                if (overlay) overlay.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

                const sn = await uploadBytes(storageRef, file);
                const url = await getDownloadURL(sn.ref);

                // Save to Firestore
                await updateDoc(doc(db, "users", currentUser.uid), { avatarUrl: url });
                userData.avatarUrl = url;
                renderProfileView(); // re-render

            } catch (err) {
                alert("Chyba při nahrávání: " + err.message);
                renderProfileView();
            }
        };

        // Dynamicky načte itineráře z Firestore a vytvoří checkboxy
        async function populateTripCheckboxes(checkedTrips = []) {
            const container = document.getElementById('trip-checkboxes');
            if (!container || !isConfigured) return;
            try {
                const { getDocs, collection } = await import('./firebase-config.js').then(m => m);
                const snap = await getDocs(collection(db, 'itineraries'));
                const titles = [];
                snap.forEach(d => { if (d.data().title) titles.push(d.data().title); });

                if (titles.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">Zatím nejsou vytvořeny žádné itineráře.</p>';
                    return;
                }

                container.innerHTML = titles.map(title => `
                    <label style="display:flex;flex-direction:row;align-items:center;gap:12px;cursor:pointer;color:var(--text-main);margin:0;">
                        <input type="checkbox" value="${title}" class="trip-checkbox"
                            style="width:20px;height:20px;margin:0;"
                            ${checkedTrips.includes(title) ? 'checked' : ''}>
                        <span>${title}</span>
                    </label>
                `).join('');
            } catch (err) {
                console.error('Chyba načítání itinerářů pro profil:', err);
                container.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">Nepodařilo se načíst itineráře.</p>';
            }
        }

        document.getElementById('profile-edit-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            document.getElementById('save-profile-btn').innerText = "Ukládám...";

            const selectedTrips = Array.from(document.querySelectorAll('.trip-checkbox:checked')).map(cb => cb.value).join(', ');

            const updates = {
                displayName: document.getElementById('edit-display-name').value,
                realName: document.getElementById('edit-real-name').value,
                gender: document.getElementById('edit-gender').value,
                city: document.getElementById('edit-city').value,
                birthDate: document.getElementById('edit-birth').value,
                trips: selectedTrips
            };

            try {
                const uRef = doc(db, "users", currentUser.uid);
                const sn = await getDoc(uRef);
                if (sn.exists()) {
                    await updateDoc(uRef, updates);
                } else {
                    await setDoc(uRef, { ...updates, createdAt: new Date().toISOString(), avatarUrl: "", email: currentUser.email });
                }
                Object.assign(userData, updates);
                cancelEdit();
                renderProfileView();
            } catch (err) {
                alert("Chyba aktualizace: " + err.message);
            }
            document.getElementById('save-profile-btn').innerText = "Uložit změny do profilu";
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (!targetUid && user) {
                // Redirect on self without param
                targetUid = user.uid;
                // update URL nicely
                window.history.replaceState(null, '', '?uid=' + user.uid);
            }
            if (targetUid) loadProfile();
            else {
                document.getElementById('profile-content-area').innerHTML = '<p style="text-align:center;">Musíte se přihlásit pro zobrazení svého profilu.</p>';
            }
        });

    </script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
    <script type="module" src="global-auth.js"></script>
</body>
